version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    groups:
      dev-tooling:
        patterns: ["eslint*", "prettier", "typescript*", "vitest", "@types/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
