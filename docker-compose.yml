services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learnly
      POSTGRES_PASSWORD: learnly
      POSTGRES_DB: learnly
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnly"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://learnly:learnly@postgres:5432/learnly
      JWT_SECRET: local-development-secret-change-me
      NODE_ENV: development
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]
